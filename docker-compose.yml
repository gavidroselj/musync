services:
  musync:
    image: ghcr.io/gavidroselj/musync
    restart: always
    volumes:
      # App config.yml, state.json and temporary files are stored in here.
      - /path/to/config:/app/config

      # Recommended mount setups are one mount per local destination. Playlists at the destination will then be created within subfolders
      # Relative root paths start from /app, so the root path for this destination should be either `/app/music` or `music`.
      - /path/to/music/destination:/app/music
